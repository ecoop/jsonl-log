[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jsonl-log"
version = "0.2.0"
description = "Append-only JSONL event log with ULID + UTC-ISO stamping and last-row-wins reads."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Eric Cooper" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Logging",
]
keywords = ["jsonl", "ndjson", "append-only", "event-log", "ulid", "audit-log"]
dependencies = [
    "python-ulid>=2.0.0",
    # python-ulid 4.x imports `override` with a `typing_extensions` fallback on
    # Python < 3.12 but doesn't declare the dep itself; supply it ourselves.
    "typing-extensions>=4.0; python_version < '3.12'",
]

[project.optional-dependencies]
# GCS durable-backend extra. Base install stays lean; consumers who want
# the GcsBackend opt in via `pip install jsonl-log[gcs]`. Floor-only, no
# upper cap — the compose semantics used here are stable across the 2.x
# and 3.x lines.
gcs = [
    "google-cloud-storage>=2.10",
]
# Development / test extras.
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/ecoop/jsonl-log"
Repository = "https://github.com/ecoop/jsonl-log"
Issues = "https://github.com/ecoop/jsonl-log/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jsonl_log"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
